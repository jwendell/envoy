name: Check/clang-tidy

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      dockerhub-token:
    inputs:
      request:
        type: string
        required: true
      trusted:
        type: boolean
        required: true

concurrency:
  group: ${{ github.head_ref || github.run_id }}-${{ github.workflow }}-clang-tidy
  cancel-in-progress: true


jobs:
  clang-tidy:
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/_run.yml
    name: ${{ matrix.name || matrix.target }}
    with:
      bazel-cache: true
      bazel-extra: '--config=rbe'
      cache-build-image: ${{ fromJSON(inputs.request).request.build-image.default }}
      concurrency-suffix: -${{ matrix.target }}
      error-match: |
        ERROR
        error:
        Error:
      rbe: true
      request: ${{ inputs.request }}
      target: ${{ matrix.target }}
      timeout-minutes: 180
      trusted: ${{ inputs.trusted }}
      upload-name: ${{ matrix.upload-name }}
      upload-path: ${{ matrix.upload-path }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: clang-tidy
          name: clang-tidy
          upload-name: clang-tidy-fixes.diff
          upload-path: /home/runner/work/_temp/container/clang-tidy-fixes.diff
